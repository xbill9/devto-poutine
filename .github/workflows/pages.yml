name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The landing page goes to the site root so the DEV embed URL is clean.
      # The standalone CSS art rides along at /css-art/.
      - name: Assemble the site
        run: |
          mkdir -p _site/css-art
          cp landing/index.html landing/styles.css landing/app.js _site/
          cp css-art/index.html _site/css-art/
          # Pages runs Jekyll by default, which would eat any _underscore paths.
          touch _site/.nojekyll

      - name: Check the files landed
        run: |
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/css-art/index.html
          echo "--- published tree ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
